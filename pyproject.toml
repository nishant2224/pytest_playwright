[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quality-demo"
version = "0.1.0"
description = "Demonstration test automation framework targeting Restful Booker Platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "allure-pytest-bdd>=2.16.2",
    "faker>=40.44.0",
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=8.0.0",
    "pytest-bdd>=9.0.0",
    "pytest-playwright>=0.5.0",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.3",
    "zensical>=0.0.74",
]

[project.scripts]
quality-demo = "quality_demo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quality_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "bdd: BDD scenarios executed via pytest-bdd",
    "ui: UI tests driving browser automation",
    "auth: Authentication scenarios",
    "smoke: Core smoke check scenarios",
    "negative: Negative input and validation failure checks",
    "e2e: End-to-end integration workflows across facades",
    "writes_data: Tests that write data to the target and require ownership cleanup",
    "api: Direct HTTP contract tests with no browser dependency",
]

[tool.poe.tasks]
check = { sequence = ["check-lint", "check-format"] }
check-lint = "ruff check ."
check-format = "ruff format --check ."
test = "pytest"
docs = "zensical serve"
docs-build = "zensical build --strict"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
