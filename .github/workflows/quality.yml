name: Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Lint, Docs, and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Playwright Chromium with system dependencies
        run: uv run playwright install --with-deps chromium

      - name: Run code quality checks
        run: uv run poe check

      - name: Build documentation (strict mode)
        run: uv run poe docs-build

      - name: Run verification test suite
        run: |
          uv run pytest --junitxml=artifacts/junit/results.xml
        continue-on-error: false

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: artifacts/
          retention-days: 7
